# Desktop Application Properties
spring.application.name=DismalDesktop

# Local Embedded Database (H2)
# Using standard file mode. AUTO_SERVER=TRUE allows multiple processes (like IDE + App) to access it if needed.
spring.datasource.url=jdbc:h2:file:${user.home}/.dismal/data/local_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
