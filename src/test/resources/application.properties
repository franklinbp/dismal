# Override the main datasource for tests to use an in-memory H2 database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Use create-drop for tests to have a clean schema for each run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# ===============================================================
# JWT SECURITY CONFIGURATION (for Tests)
# ===============================================================
application.security.jwt.secret-key=c29tZS1sb25nLWFuZC1zZWN1cmUtc2VjcmV0LWZvci1tYWxlc2tpbi1wcm9qZWN0Cg==
application.security.jwt.expiration=86400000

# ===============================================================
# DATA ENCRYPTION CONFIGURATION (for Tests)
# ===============================================================
data.encryption.aes-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# ===============================================================
# EXTERNAL INTEGRATIONS (for Tests)
# ===============================================================
integrations.n8n.webhook-url=https://your-n8n-instance.com/webhook/test-webhook

# ===============================================================
# ACTUATOR (for Tests)
# ===============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
