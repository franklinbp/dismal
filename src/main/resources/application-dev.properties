# ===============================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dismal_db
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME

# ===============================================================
# JPA & HIBERNATE CONFIGURATION
# ===============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================================================
# JWT SECURITY CONFIGURATION (Dev)
# ===============================================================
application.security.jwt.secret-key=BASE64_SECRET
application.security.jwt.expiration=86400000

# ===============================================================
# DATA ENCRYPTION CONFIGURATION (Dev)
# ===============================================================
data.encryption.aes-key=BASE64_AES_KEY

# ===============================================================
# EXTERNAL INTEGRATIONS (Dev)
# ===============================================================
integrations.n8n.webhook-url=https://your-n8n-instance.com/webhook/test-webhook
integrations.dismal-crm.enabled=false
integrations.dismal-crm.base-url=
integrations.dismal-crm.api-token=
integrations.dismal-crm.whatsapp-enabled=false
integrations.dismal-crm.whatsapp-id=

# ===============================================================
# ADMIN USERS CONFIGURATION (Dev)
# ===============================================================
app.admin.import-default-password=CHANGE_ME

# ===============================================================
# ACTUATOR / OBSERVABILITY (Dev)
# ===============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
