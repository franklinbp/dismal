# ===============================================================
# SERVER CONFIGURATION
# ===============================================================
spring.application.name=DismalDistribuciones
spring.profiles.default=dev
server.port=${PORT:8080}

# ===============================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================================
# JPA & HIBERNATE CONFIGURATION
# ===============================================================
spring.jpa.open-in-view=false

# ===============================================================
# FLYWAY MIGRATIONS
# ===============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================================================
# JWT SECURITY CONFIGURATION
# ===============================================================
application.security.jwt.secret-key=${JWT_SECRET:}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ===============================================================
# DATA ENCRYPTION CONFIGURATION
# ===============================================================
data.encryption.aes-key=${AES_KEY:}

# ===============================================================
# EXTERNAL INTEGRATIONS
# ===============================================================
integrations.n8n.webhook-url=${N8N_WEBHOOK_URL:}
integrations.n8n.secret=${N8N_SECRET:}
integrations.dismal-crm.enabled=${DISMAL_CRM_ENABLED:false}
integrations.dismal-crm.base-url=${DISMAL_CRM_BASE_URL:}
integrations.dismal-crm.api-token=${DISMAL_CRM_API_TOKEN:}
integrations.dismal-crm.whatsapp-enabled=${DISMAL_CRM_WHATSAPP_ENABLED:false}
integrations.dismal-crm.whatsapp-id=${DISMAL_CRM_WHATSAPP_ID:}
integrations.dismal-crm.whatsapp-id-by-country=${DISMAL_CRM_WHATSAPP_ID_BY_COUNTRY:}
integrations.woocommerce.api-key=${WOOCOMMERCE_API_KEY:}

# ===============================================================
# SALES TARGETS (PLANNING)
# ===============================================================
app.sales.fixed-cost-global=${SALES_FIXED_COST_GLOBAL:300}
app.sales.fixed-cost-mode=${SALES_FIXED_COST_MODE:GLOBAL}

# ===============================================================
# OUTBOX DISPATCHER CONFIGURATION
# ===============================================================
outbox.dispatch.enabled=${OUTBOX_DISPATCH_ENABLED:true}
outbox.dispatch.rate-ms=${OUTBOX_DISPATCH_RATE_MS:5000}
outbox.dispatch.max-attempts=${OUTBOX_DISPATCH_MAX_ATTEMPTS:10}

# ===============================================================
# SMTP EMAIL (CONFIGURABLE IN INTEGRATIONS)
# ===============================================================
app.email.smtp.enabled=${SMTP_ENABLED:false}
app.email.smtp.host=${SMTP_HOST:}
app.email.smtp.port=${SMTP_PORT:0}
app.email.smtp.user=${SMTP_USER:}
app.email.smtp.password=${SMTP_PASSWORD:}
app.email.smtp.tls=${SMTP_TLS:true}
app.email.smtp.from-email=${SMTP_FROM_EMAIL:}
app.email.smtp.from-name=${SMTP_FROM_NAME:}

# ===============================================================
# ADMIN USERS CONFIGURATION
# ===============================================================
app.admin.ar.block-days=${ADMIN_AR_BLOCK_DAYS:30}
app.admin.reset-password-enabled=${ADMIN_RESET_PASSWORD_ENABLED:false}
app.admin.import-default-password=${ADMIN_IMPORT_DEFAULT_PASSWORD:}

# ===============================================================
# NOTIFICATIONS / INVOICES
# ===============================================================
app.invoice.pdf-base-url=${INVOICE_PDF_BASE_URL:}
app.ar.overdue.cron=${AR_OVERDUE_CRON:0 10 2 * * *}

# ===============================================================
# CORS
# ===============================================================
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===============================================================
# CUSTOMER ACCOUNT LINKS
# ===============================================================
app.account.ec-storefront-url=${ACCOUNT_EC_STOREFRONT_URL:https://dismal.net}
app.account.pe-storefront-url=${ACCOUNT_PE_STOREFRONT_URL:https://dismal.net.pe}
