# ===============================================================
# SERVER CONFIGURATION
# ===============================================================
spring.application.name=Dismal
server.port=${PORT:8080}

# ===============================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================================
# JPA & HIBERNATE CONFIGURATION
# ===============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================================================
# JWT SECURITY CONFIGURATION
# ===============================================================
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ===============================================================
# DATA ENCRYPTION CONFIGURATION
# ===============================================================
data.encryption.aes-key=${AES_KEY}

# ===============================================================
# EXTERNAL INTEGRATIONS
# ===============================================================
integrations.n8n.webhook-url=${N8N_WEBHOOK_URL:}
integrations.n8n.secret=${N8N_SECRET:}

# ===============================================================
# SALES TARGETS (PLANNING)
# ===============================================================
app.sales.fixed-cost-global=${SALES_FIXED_COST_GLOBAL:300}
app.sales.fixed-cost-mode=${SALES_FIXED_COST_MODE:GLOBAL}

# ===============================================================
# OUTBOX DISPATCHER CONFIGURATION
# ===============================================================
outbox.dispatch.enabled=${OUTBOX_DISPATCH_ENABLED:true}
outbox.dispatch.rate-ms=${OUTBOX_DISPATCH_RATE_MS:5000}
outbox.dispatch.max-attempts=${OUTBOX_DISPATCH_MAX_ATTEMPTS:10}

# ===============================================================
# ADMIN USERS CONFIGURATION
# ===============================================================
app.admin.ar.block-days=${ADMIN_AR_BLOCK_DAYS:30}
app.admin.reset-password-enabled=${ADMIN_RESET_PASSWORD_ENABLED:false}
app.admin.import-default-password=${ADMIN_IMPORT_DEFAULT_PASSWORD}

# ===============================================================
# NOTIFICATIONS / INVOICES
# ===============================================================
app.invoice.pdf-base-url=${INVOICE_PDF_BASE_URL:}
app.ar.overdue.cron=${AR_OVERDUE_CRON:0 10 2 * * *}

# ===============================================================
# ACTUATOR / HEALTH
# ===============================================================
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ===============================================================
# CORS
# ===============================================================
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================================================
# CUSTOMER ACCOUNT LINKS
# ===============================================================
app.account.ec-storefront-url=${ACCOUNT_EC_STOREFRONT_URL:https://dismal.net}
app.account.pe-storefront-url=${ACCOUNT_PE_STOREFRONT_URL:https://dismal.net.pe}
